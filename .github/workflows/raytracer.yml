name: raytracer

on:
  push:
    branches-ignore:
      - "ga-ignore-*"
  pull_request:
    types: [opened]
    branches-ignore:
      - "ga-ignore-*"

env:
  EXECUTABLES: raytracer
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check_program_compilation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libsfml-dev

      - name: Build project
        timeout-minutes: 2
        run: make

      - name: Clean build
        run: make clean

      - name: Complete clean build
        run: make fclean

      - name: Check executables
        run: |
          for exec in $EXECUTABLES; do
            if [ ! -f "$exec" ]; then
              echo "::error title=Missing executable::$exec not found"
              exit 1
            fi
            if [ ! -x "$exec" ]; then
              echo "::error title=Not executable::$exec is not executable"
              exit 1
            fi
          done
