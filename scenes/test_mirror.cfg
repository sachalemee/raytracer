camera:
{
    resolution = { width = 800; height = 450; };
    position = { x = 0; y = -80; z = 15; };
    rotation = { x = 0; y = 0; z = 0; };
    fieldOfView = 72.0;
};

primitives:
{
    spheres = (
        # Sphère miroir (centre)
        { x = 0; y = 30; z = 10; r = 18;
          reflectivity = 1.0; },
        # Sphère rouge (gauche)
        { x = -45; y = 25; z = 5; r = 14;
          color = { r = 220; g = 50; b = 50; }; },
        # Sphère bleue (droite)
        { x = 45; y = 25; z = 5; r = 14;
          color = { r = 50; g = 80; b = 220; }; },
        # Petite sphère verte (arrière)
        { x = 10; y = 60; z = 20; r = 10;
          color = { r = 50; g = 200; b = 80; }; }
    );
    planes = (
        # Sol
        { axis = "Z"; position = -10;
          color = { r = 180; g = 180; b = 180; }; }
    );
};

lights:
{
    ambient = 0.3;
    diffuse = 0.8;
    directional = (
        { x = -1; y = 1; z = -1; }
    );
};
