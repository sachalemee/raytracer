        # Mars (rouge)
        { x = 50; y = 42; z = 4; r = 12;
          color = { r = 200; g = 60; b = 30; }; },
        # Lune (miroir gris)
        { x = -28; y = 32; z = 22; r = 7;
          material = { type = "mirror"; reflectivity = 0.6;
                       tint = { r = 180; g = 175; b = 170; }; }; },
        # Jupiter (beige rayé)
        { x = 70; y = 75; z = 20; r = 22;
          color = { r = 200; g = 165; b = 110; }; },
        # Saturne (dorée)
        { x = -75; y = 85; z = 35; r = 16;
          color = { r = 210; g = 185; b = 100; }; }
