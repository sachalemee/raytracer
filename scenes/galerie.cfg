camera:
{
    resolution = { width = 800; height = 450; };
    position = { x = 0; y = -100; z = 20; };
    rotation = { x = 0; y = 0; z = 0; };
    fieldOfView = 75.0;
};

primitives:
{
    spheres = (
        # Rouge mat
        { x = -75; y = 45; z = 8; r = 16;
          color = { r = 220; g = 45; b = 45; }; },
        # Miroir parfait
        { x = -35; y = 40; z = 8; r = 16;
          material = { type = "mirror"; reflectivity = 1.0;
                       tint = { r = 255; g = 255; b = 255; }; }; },
        # Bleu mat
        { x = 5; y = 38; z = 8; r = 16;
          color = { r = 40; g = 90; b = 210; }; },
        # Miroir doré (semi-réfléchissant)
        { x = 45; y = 40; z = 8; r = 16;
          material = { type = "mirror"; reflectivity = 0.65;
                       tint = { r = 230; g = 180; b = 50; }; }; },
        # Vert mat
        { x = 85; y = 45; z = 8; r = 16;
          color = { r = 40; g = 185; b = 70; }; }
    );
    planes = (
        # Sol damier noir/blanc
        { axis = "Z"; position = -12;
          material = { type = "chessboard";
                       color1 = { r = 240; g = 240; b = 240; };
                       color2 = { r = 20;  g = 20;  b = 20;  };
                       scale = 14.0; }; },
        # Mur du fond
        { axis = "Y"; position = 130;
          color = { r = 50; g = 50; b = 60; }; }
    );
    cylinders = (
        # Colonne gauche
        { x = -100; y = 80; z = 12; r = 7; height = 55;
          material = { type = "mirror"; reflectivity = 0.85;
                       tint = { r = 200; g = 200; b = 200; }; }; },
        # Colonne droite
        { x = 110; y = 80; z = 12; r = 7; height = 55;
          material = { type = "mirror"; reflectivity = 0.85;
                       tint = { r = 200; g = 200; b = 200; }; }; }
    );
};

lights:
{
    ambient = 0.38;
    diffuse = 0.75;
    directional = (
        { x = -1; y = 1; z = -1; }
    );
};
